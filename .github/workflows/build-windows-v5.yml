name: Build PII Scrubber V5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'app_v401.py'
      - 'app_v402.py'
      - 'app_v5.py'
      - 'requirements.txt'
      - 'installer/PII-Scrubber-v5.iss'
      - '.github/workflows/build-windows-v5.yml'

jobs:
  build-v5:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install local OCR runtime
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $candidates = @(
            'C:\Program Files\Tesseract-OCR',
            'C:\Program Files (x86)\Tesseract-OCR',
            'C:\tools\tesseract'
          )
          $src = $candidates | Where-Object { Test-Path (Join-Path $_ 'tessdata\eng.traineddata') } | Select-Object -First 1
          if (!$src) {
            $found = Get-ChildItem 'C:\' -Filter eng.traineddata -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $src = Split-Path (Split-Path $found.FullName -Parent) -Parent }
          }
          if (!$src) { throw 'Tesseract English OCR data was not installed or could not be located.' }
          New-Item -ItemType Directory -Force -Path bundled-ocr | Out-Null
          Copy-Item (Join-Path $src 'tessdata') 'bundled-ocr\tessdata' -Recurse -Force
          if (!(Test-Path 'bundled-ocr\tessdata\eng.traineddata')) { throw 'OCR data copy failed.' }

      - name: Validate source
        run: |
          python -m py_compile app.py app_v401.py app_v402.py app_v5.py

      - name: Build V5 desktop application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --contents-directory . --name PII-Scrubber-v5 --collect-all fitz --add-data "bundled-ocr\tessdata;Tesseract-OCR\tessdata" app_v5.py
          if (!(Test-Path 'dist\PII-Scrubber-v5\PII-Scrubber-v5.exe')) { throw 'V5 executable missing.' }

      - name: Verify packaged OCR data
        shell: pwsh
        run: |
          $rootOcr = 'dist\PII-Scrubber-v5\Tesseract-OCR\tessdata\eng.traineddata'
          $internalOcr = 'dist\PII-Scrubber-v5\_internal\Tesseract-OCR\tessdata\eng.traineddata'
          if (!(Test-Path $rootOcr) -and !(Test-Path $internalOcr)) { throw 'Bundled OCR data missing from V5 application.' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build V5 installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer\PII-Scrubber-v5.iss'
          if (!(Test-Path 'installer-output-v5\PII-Scrubber-v5-Setup.exe')) { throw 'V5 installer was not created.' }

      - name: Upload V5 installer
        uses: actions/upload-artifact@v4
        with:
          name: PII-Scrubber-V5-Windows-Installer
          path: installer-output-v5/PII-Scrubber-v5-Setup.exe
          if-no-files-found: error
          retention-days: 90
